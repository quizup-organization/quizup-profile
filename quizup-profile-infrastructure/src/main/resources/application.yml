spring:
  config:
    import: optional:classpath:quizup-defaults.yml
  application:
    name: quizup-profile
  profiles:
    default: local

  flyway:
    locations: classpath:db/migration/profile

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  data:
    redis:
      # Store chaud de la présence (leases de session). Sans auth in-cluster (Service non exposé).
      host: ${QUIZUP_REDIS_HOST:localhost}
      port: ${QUIZUP_REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

microservice:
  swagger:
    description: QuizUp Profile Module - User profile management (display name, bio, country)
  websocket:
    # La présence est pilotée par les sessions STOMP du BFF (seule surface temps réel).
    enabled: false

app:
  seed-data:
    enabled: true
  activity:
    # Fuseau servant à découper les « jours » du graphe d'activité (streak journalière)
    zone: Europe/Paris


